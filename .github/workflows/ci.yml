name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EXPO_NO_DOTENV: '1'

concurrency:
  group: tasktrace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      # Static export imports the Supabase client, so it needs syntactically
      # valid public configuration even though CI never contacts Supabase.
      # These values are deliberately non-secret and are not deployment config.
      EXPO_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        id: dependencies
      - run: npm run check:db
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build:web
      # Maps are isolated CI evidence, not part of the deployable dist artifact.
      - run: node scripts/security-export.mjs --platform web --platform android --platform ios --source-maps --output-dir .expo/security-export
      - run: npx --yes expo-doctor@1.21.5
      - name: Full audit and approved security policy gate
        if: always() && steps.dependencies.outcome == 'success'
        run: node scripts/security-policy-gate.mjs --bundles .expo/security-export
      - name: Preserve raw audit and policy decision
        if: always() && steps.dependencies.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-policy-${{ github.run_attempt }}
          path: .expo/security-policy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes supabase@2.116.0 start
      - run: npm run test:sql -- --fresh
      - run: npm run test:sql -- --cron --advisors
      - run: npm run test:backend:isolated
      - run: node scripts/run-audit-remediation-tests.mjs
      - run: node scripts/audit-followup-integration.mjs
      - run: node scripts/regression-write-protocol.mjs
      - run: npm run test:security
      - run: node scripts/verify-audit-regressions.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/regression-mutation-browser.mjs
      - run: node scripts/run-security-integrations.mjs scripts/audit-remediation-browser.mjs scripts/template-realtime-browser.mjs
      - run: node scripts/pwa-mobile-browser-smoke.mjs
      - run: npx --yes supabase@2.116.0 db lint --local
      - run: npx --yes supabase@2.116.0 db advisors --local
      - name: Stop disposable CI Supabase stack
        if: always()
        run: npx --yes supabase@2.116.0 stop --no-backup
